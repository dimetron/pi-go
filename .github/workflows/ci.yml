name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# No workflow-wide GOEXPERIMENT: Go 1.27 changed the simd/archsimd intrinsics
# API, which gomlx/compute's amd64 kernels (gated on goexperiment.simd) do not
# compile against yet. The measured benefit of those kernels was noise anyway
# (see Makefile history), so builds now use the default experiment set.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # The gate fails only on findings that name a fixed version. A finding
      # with no fix cannot be acted on here — there is nothing to upgrade to —
      # so failing on it would leave this check red on every commit until an
      # upstream maintainer cuts a release, and a check that is always red is a
      # check nobody reads. Unfixed findings are printed, so a fix appearing
      # later turns one into a build failure exactly when someone should look.
      - name: govulncheck
        run: govulncheck -format json ./... | go run ./hack/vulngate

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Cache must stay off: pyproject.toml only lives under the LSP
          # Python fixture, so the action's post-job cache-save step would
          # error with "Cache path ... does not exist" and fail the job.
          enable-cache: false
      - name: Install rustup
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          # Cargo.toml lives under the LSP rust fixture, not the repo root,
          # so point the action at it — otherwise the implicit workspace
          # lookup fails the step with "could not find Cargo.toml".
          cache-workspaces: hack/test/lsp/rust
      - name: Run tests
        run: go test -count=1 ./...
      - name: Run race tests
        run: go test -race -count=1 $(go list ./... | grep -v '/internal/acp/server$')

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests
        # No -race here: that needs CGO_ENABLED=1 and a C toolchain, which
        # windows-latest doesn't carry by default. This is the only job that
        # actually executes the //go:build windows files (internal/tui,
        # internal/codex, internal/subagent) — the `build` job above only
        # cross-compiles them from Linux, it never runs them.
        run: go test -count=1 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Cache must stay off: pyproject.toml only lives under the LSP
          # Python fixture, so the action's post-job cache-save step would
          # error with "Cache path ... does not exist" and fail the job.
          enable-cache: false
      - name: Install rustup
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-workspaces: hack/test/lsp/rust
      - name: Run tests with coverage
        # Every package except cmd/ (excluded in codecov.yml) and the hack/
        # fixtures. Derived from `go list` rather than hard-coded to
        # ./internal/..., because that pattern silently omitted the public
        # packages: their files never entered the profile, so Codecov counted
        # every line of them as a miss on the diff.
        #
        # Not -coverpkg=./... — instrumenting cmd/ and hack/ too slows the
        # test binaries enough to trip the idle-timeout assertion in
        # internal/tools' bash supervisor tests.
        run: |
          pkgs=$(go list ./... | grep -Ev '/(cmd|hack)/')
          go test -coverprofile=coverage.out -coverpkg="$(echo "$pkgs" | paste -sd, -)" $pkgs
      - name: Coverage report
        run: go tool cover -func=coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o pi ./cmd/pi
      - name: Verify binary
        if: matrix.goos == 'linux'
        run: ./pi --help || true
