name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# gomlx's Go backend takes its matmul kernels from Go 1.26's simd/archsimd, gated
# on `//go:build amd64 && goexperiment.simd`. CI runs on amd64 runners, so this is
# where it actually applies; it is inert on the arm64 matrix entries because
# upstream ships no NEON kernels. Set workflow-wide so every job builds the same
# way and the build cache is shared rather than split per-job.
env:
  GOEXPERIMENT: simd

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9
        with:
          version: v2.11

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8
        with:
          # Cache must stay off: pyproject.toml only lives under the LSP
          # Python fixture, so the action's post-job cache-save step would
          # error with "Cache path ... does not exist" and fail the job.
          enable-cache: false
      - name: Install rustup
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          # Cargo.toml lives under the LSP rust fixture, not the repo root,
          # so point the action at it — otherwise the implicit workspace
          # lookup fails the step with "could not find Cargo.toml".
          cache-workspaces: hack/test/lsp/rust
      - name: Run tests
        run: go test -count=1 ./...
      - name: Run race tests
        run: go test -race -count=1 $(go list ./... | grep -v '/internal/acp/server$')

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8
        with:
          # Cache must stay off: pyproject.toml only lives under the LSP
          # Python fixture, so the action's post-job cache-save step would
          # error with "Cache path ... does not exist" and fail the job.
          enable-cache: false
      - name: Install rustup
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          cache-workspaces: hack/test/lsp/rust
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -coverpkg=./internal/... ./internal/...
      - name: Coverage report
        run: go tool cover -func=coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o pi ./cmd/pi
      - name: Verify binary
        if: matrix.goos == 'linux'
        run: ./pi --help || true
