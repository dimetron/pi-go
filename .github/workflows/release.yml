name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race -count=1 ./...

  release:
    name: GoReleaser
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Mint the OIDC token that Sigstore exchanges for a signing certificate.
      id-token: write
      # Persist the attestations against this repository.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Check if release already exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Built before GoReleaser, because `release --clean` wipes dist/ and
      # because release.extra_files needs the file to already be on disk.
      # hack/ is excluded: the LSP fixtures there carry their own Cargo.toml
      # and pyproject.toml, and none of it ships in the binary.
      - name: Generate source SBOM
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          syft scan dir:. \
            --exclude './hack/**' \
            --source-name "${GITHUB_REPOSITORY#*/}" \
            --source-version "${GITHUB_REF_NAME}" \
            --output spdx-json=sbom.spdx.json

      - name: Run GoReleaser
        if: steps.check_release.outputs.release_exists == 'false'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attest the archives *and* the raw binaries inside them. install.sh
      # extracts the binary and drops it on the user's PATH, so the archive
      # digest is not the digest anyone ends up running — without the
      # `dist/*/pi*` entries, `pi verify` could never verify itself.
      #
      # The binaries are attested but not published: an extra ~100 MB asset
      # per platform is not worth it when the digest is what verification
      # needs. Patterns that match nothing are ignored, so dropping a platform
      # from the build matrix does not fail this step.
      - name: Attest build provenance
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*/pi
            dist/*/pi.exe

      # One SBOM covers every subject: a Go binary's dependency set is its
      # module graph, which is identical across the goos/goarch matrix. The
      # per-platform SBOMs GoReleaser publishes stay available as release
      # assets for anyone who wants the binary-level catalog.
      - name: Attest SBOM
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*/pi
            dist/*/pi.exe
          sbom-path: sbom.spdx.json
