name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9
        with:
          version: v2.11

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race -count=1 ./...

  release:
    name: GoReleaser
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Mint the OIDC token that Sigstore exchanges for a signing certificate.
      id-token: write
      # Persist the attestations against this repository.
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Check if release already exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Built before GoReleaser, because `release --clean` wipes dist/ and
      # because release.extra_files needs the file to already be on disk.
      # hack/ is excluded: the LSP fixtures there carry their own Cargo.toml
      # and pyproject.toml, and none of it ships in the binary.
      - name: Generate source SBOM
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          syft scan dir:. \
            --exclude './hack/**' \
            --source-name "${GITHUB_REPOSITORY#*/}" \
            --source-version "${GITHUB_REF_NAME}" \
            --output spdx-json=sbom.spdx.json

      - name: Run GoReleaser
        if: steps.check_release.outputs.release_exists == 'false'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # checksums.txt names every artifact GoReleaser published — archives and
      # their per-archive SBOMs — so one step attests the whole release without
      # duplicating the build matrix here.
      - name: Attest build provenance
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # One SBOM covers every archive: a Go binary's dependency set is its
      # module graph, which is identical across the goos/goarch matrix. The
      # per-platform SBOMs GoReleaser publishes stay available as release
      # assets for anyone who wants the binary-level catalog.
      - name: Attest SBOM
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: dist/checksums.txt
          sbom-path: sbom.spdx.json
