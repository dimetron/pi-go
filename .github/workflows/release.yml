name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race -count=1 ./...

  docker:
    name: Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      # Push the pi-go-kagent harness image to GHCR.
      packages: write
      contents: read
    outputs:
      # The manifest-list digest of the image just pushed. The kagent manifest
      # is pinned to it, so the release ships a reference to exactly the image
      # this run built rather than to a tag that later moves.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the kagent harness image
        id: build
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v6.20.0
        with:
          context: .
          file: specs/kagent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-kagent:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-kagent:latest

  release:
    name: GoReleaser
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Mint the OIDC token that Sigstore exchanges for a signing certificate.
      id-token: write
      # Persist the attestations against this repository.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Check if release already exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Built before GoReleaser, because `release --clean` wipes dist/ and
      # because release.extra_files needs the file to already be on disk.
      # hack/ is excluded: the LSP fixtures there carry their own Cargo.toml
      # and pyproject.toml, and none of it ships in the binary.
      - name: Generate source SBOM
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          syft scan dir:. \
            --exclude './hack/**' \
            --source-name "${GITHUB_REPOSITORY#*/}" \
            --source-version "${GITHUB_REF_NAME}" \
            --output spdx-json=sbom.spdx.json

      - name: Run GoReleaser
        if: steps.check_release.outputs.release_exists == 'false'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attest the archives *and* the raw binaries inside them. install.sh
      # extracts the binary and drops it on the user's PATH, so the archive
      # digest is not the digest anyone ends up running — without the
      # `dist/*/pi*` entries, `pi verify` could never verify itself.
      #
      # The binaries are attested but not published: an extra ~100 MB asset
      # per platform is not worth it when the digest is what verification
      # needs. Patterns that match nothing are ignored, so dropping a platform
      # from the build matrix does not fail this step.
      - name: Attest build provenance
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*/pi
            dist/*/pi.exe

      # One SBOM covers every subject: a Go binary's dependency set is its
      # module graph, which is identical across the goos/goarch matrix. The
      # per-platform SBOMs GoReleaser publishes stay available as release
      # assets for anyone who wants the binary-level catalog.
      - name: Attest SBOM
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*/pi
            dist/*/pi.exe
          sbom-path: sbom.spdx.json

  # The deployable kagent manifest for this release.
  #
  # specs/kagent/manifests.yaml.tmpl is a template because Substrate requires a
  # digest-pinned image and a digest only exists once an image is pushed —
  # committing a rendered copy means committing a digest that is stale by the
  # next build. Rendering here pins it to the image this run actually pushed.
  #
  # Rendered with --no-env so the published manifest carries no cluster-specific
  # model endpoint; the operator sets PI_MODEL / PI_BASE_URL for their cluster.
  kagent-manifest:
    name: kagent manifest
    needs: [docker, release]
    runs-on: ubuntu-latest
    permissions:
      # Upload the rendered manifest as a release asset.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render the manifest against the pushed digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}-kagent@${{ needs.docker.outputs.digest }}
        run: |
          test -n "${{ needs.docker.outputs.digest }}" || {
            echo "the docker job produced no digest" >&2
            exit 1
          }
          ./specs/kagent/render-manifests.sh \
            --image "${IMAGE}" \
            --no-env \
            --output kagent-manifests.yaml
          cat kagent-manifests.yaml

      - name: Attach it to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release is still a draft at this point (see the `draft: true` in
          # .goreleaser.yaml), which is the only state an asset can be attached
          # in on an immutable repository. On a re-run the published release is
          # already sealed, so skip rather than fail the workflow with the 422.
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "release ${GITHUB_REF_NAME} is already published; skipping"
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" kagent-manifests.yaml --clobber

  vscode:
    name: VS Code extension
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      # Attach the packaged VSIX as a release asset.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build the VSIX
        working-directory: vscode
        run: |
          bun install --frozen-lockfile
          make release

      - name: Attach it to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Draft-only, for the same reason as the kagent manifest: immutable
          # releases accept no asset once published, so a re-run against an
          # already-published release skips instead of failing.
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "release ${GITHUB_REF_NAME} is already published; skipping"
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" vscode/pi-go-vscode-*.vsix --clobber

  # Immutable releases are sealed when published, so this is the last step: the
  # release stays a draft while the kagent manifest and the VSIX attach, and is
  # published here with every asset already in place.
  #
  # Deliberately not `if: always()`. If an attaching job failed, publishing
  # anyway would produce a permanently incomplete release — immutability means
  # the missing asset can never be added afterwards. Leaving it a draft is the
  # recoverable outcome: the draft still holds the tag, and re-running the
  # workflow finds it (the release-exists check reads drafts), re-attaches the
  # assets with --clobber, and publishes. A human can also publish it by hand.
  #
  # The guards keep this a no-op when the release was never created (a re-run
  # where GoReleaser skipped) or is already published.
  #
  # Every `gh` call passes --repo. This job used to omit the checkout the other
  # jobs have, which left `gh` with no repository to infer: it failed with
  # "failed to run git: not a git repository" on every invocation. The guard
  # below reads a non-zero exit as "no release exists", so it printed
  # "nothing to publish" and exited 0 while the draft was still sitting there —
  # v0.1.9 and v0.2.0 shipped as CI-green and never published. --repo makes the
  # commands independent of the working directory, so removing the checkout
  # again cannot reintroduce a silent pass.
  publish:
    name: Publish release
    needs: [release, kagent-manifest, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "no release for ${GITHUB_REF_NAME}; nothing to publish"
            exit 0
          fi
          if [ "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "release ${GITHUB_REF_NAME} is already published"
            exit 0
          fi
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isImmutable,assets \
            --jq '"published: draft=\(.isDraft) immutable=\(.isImmutable) assets=\([.assets[].name] | length)"'
