SPECIFICATION FairSpec

\* MaxCycles = 1 keeps the state graph inside the chart budget of 500 while
\* still covering: a fresh cycle, a completion, a stop, a pause, a resume that
\* renews a spent budget, and the drain in setGoal. MaxBudget = 3 grants exactly
\* one renewal, which is the smallest bound that exercises ResumeRenew.
CONSTANTS
    MaxCycles  = 1
    MaxBudget  = 3

INVARIANT OnlyActiveRuns
INVARIANT CompleteIsTerminal
INVARIANT BudgetBounded
INVARIANT InFlightCycleIsCurrent
INVARIANT SlotAttributable
INVARIANT CompletionMatchesObjective
