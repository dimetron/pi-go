<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi-Go Pairing</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Pi-Go Pairing</h1>
        
        <div id="pairing-form">
            <p>Loading active pairing session...</p>
        </div>
        
        <div id="pairing-info" class="hidden">
            <form class="code-entry" id="code-submit-form" action="/api/pair/submit" method="post">
                <input id="code-input" name="code" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit pair code" />
                <button id="submit-code-btn" type="submit">Submit Code</button>
            </form>
            <div class="qr-container">
                <img id="qr-image" width="200" height="200" alt="Pairing QR code" />
            </div>
            <p class="instructions" id="qr-host"></p>
            <p class="instructions">Scan this QR with the Pi-Go mobile app, or enter the pair code from the terminal.</p>
            <div id="status" class="status pending">
                <span id="status-text">Waiting for approval...</span>
            </div>
        </div>
        
        <div id="error" class="hidden error">
            <span id="error-text"></span>
        </div>
    </div>
    
    <script>
        let pollInterval;
        let currentToken = '';
        
        const pairingForm = document.getElementById('pairing-form');
        const pairingInfo = document.getElementById('pairing-info');
        const errorDiv = document.getElementById('error');
        const errorText = document.getElementById('error-text');
        const codeSubmitForm = document.getElementById('code-submit-form');
        const codeInput = document.getElementById('code-input');
        const submitCodeBtn = document.getElementById('submit-code-btn');
        const qrImage = document.getElementById('qr-image');
        const qrHost = document.getElementById('qr-host');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('status-text');

        qrHost.textContent = 'Server: ' + window.location.host;
        
        function showError(msg) {
            errorDiv.classList.remove('hidden');
            errorText.textContent = msg;
        }
        
        function hideError() {
            errorDiv.classList.add('hidden');
        }
        
        function updateStatus(status) {
            statusDiv.className = 'status ' + status;
            switch (status) {
                case 'pending':
                    statusText.textContent = 'Waiting for approval...';
                    break;
                case 'approved':
                    statusText.textContent = 'Approved! Redirecting...';
                    break;
                case 'expired':
                    statusText.textContent = 'Code expired. Generating a new code...';
                    clearInterval(pollInterval);
                    setTimeout(generateCode, 500);
                    break;
                case 'unknown':
                    statusText.textContent = 'Code not found. Generating a new code...';
                    clearInterval(pollInterval);
                    setTimeout(generateCode, 500);
                    break;
            }
        }
        
        function checkStatus(token) {
            return fetch('/api/status?token=' + encodeURIComponent(token))
                .then(r => {
                    if (!r.ok) throw new Error('Status check failed');
                    return r.json();
                })
                .then(data => {
                    updateStatus(data.status);
                    return data;
                })
                .catch(err => {
                    showError('Failed to check status: ' + err.message);
                });
        }
        
        function startPolling(token) {
            currentToken = token;
            checkStatus(token);
            pollInterval = setInterval(() => checkStatus(token), 2000);
        }

        function normalizeCode(value) {
            return (value || '').replace(/\s+/g, '').trim();
        }

        function validateCodeInput() {
            const entered = normalizeCode(codeInput.value);
            if (!entered) {
                showError('Please enter the 6-digit pair code.');
                return false;
            }
            if (entered.length !== 6) {
                showError('Pair code must be exactly 6 digits.');
                return false;
            }
            if (!/^\d{6}$/.test(entered)) {
                showError('Pair code must contain only digits.');
                return false;
            }
            hideError();
            return true;
        }
        
        function generateCode() {
            hideError();
            
            fetch('/api/pair')
            .then(r => {
                if (!r.ok) throw new Error('Failed to generate code');
                return r.json();
            })
            .then(data => {
                currentToken = data.token;
                codeInput.value = '';
                setSubmitting(false);

                // Render server-generated QR PNG.
                qrImage.src = 'data:image/png;base64,' + data.qr;
                
                // Show pairing info
                pairingForm.classList.add('hidden');
                pairingInfo.classList.remove('hidden');
                statusDiv.className = 'status pending';
                statusText.textContent = 'Enter pair code and submit to start waiting for approval.';
            })
            .catch(err => {
                showError('Failed to generate code: ' + err.message);
                pairingForm.classList.remove('hidden');
                pairingForm.querySelector('p').textContent = 'Failed to generate code. Retrying...';
                setTimeout(generateCode, 2000);
            });
        }
        
        // Handle approved status
        function handleApproved() {
            clearInterval(pollInterval);
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        }
        
        // Override updateStatus to handle approved
        const originalUpdateStatus = updateStatus;
        updateStatus = function(status) {
            originalUpdateStatus(status);
            if (status === 'approved') {
                handleApproved();
            }
        };

        function setSubmitting(busy) {
            submitCodeBtn.disabled = busy;
            // readOnly, not disabled: a control disabled inside the submit
            // handler is dropped from the form entry list, so the server would
            // receive an empty code and bounce back to /pair forever.
            codeInput.readOnly = busy;
        }

        function submitCode(code) {
            setSubmitting(true);
            statusDiv.className = 'status pending';
            statusText.textContent = 'Submitting pair code...';

            fetch('/api/pair/submit', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({code: code})
            })
                .then(r => r.text().then(body => ({ok: r.ok, body: body})))
                .then(res => {
                    if (!res.ok) {
                        throw new Error((res.body || '').trim() || 'Pair code rejected.');
                    }
                    hideError();
                    updateStatus('approved');
                })
                .catch(err => {
                    setSubmitting(false);
                    codeInput.focus();
                    codeInput.select();
                    statusDiv.className = 'status pending';
                    statusText.textContent = 'Enter pair code and submit to start waiting for approval.';
                    showError(err.message);
                });
        }

        codeSubmitForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (pairingInfo.classList.contains('hidden')) {
                return;
            }
            if (!validateCodeInput()) {
                return;
            }

            submitCode(normalizeCode(codeInput.value));
        });
        
        // Check URL for existing token
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const submitError = urlParams.get('error');
        if (submitError) {
            showError(submitError);
        }
        if (token) {
            // Show existing pairing info
            pairingForm.classList.add('hidden');
            pairingInfo.classList.remove('hidden');
            startPolling(token);
        } else {
            // Automatically create a fresh pairing code on page load.
            generateCode();
        }
    </script>
</body>
</html>
