<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi-Go Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: #1e1e1e;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        .container {
            background: transparent;
            box-shadow: none;
            padding: 0;
            max-width: 100%;
            height: 100vh;
        }
        
        #terminal {
            height: 100vh;
            padding: 10px;
        }
        
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            z-index: 1000;
        }
        
        .connection-status.connected {
            background: #28a745;
            color: white;
        }
        
        .connection-status.disconnected {
            background: #dc3545;
            color: white;
        }
        
        .connection-status.connecting {
            background: #ffc107;
            color: black;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* Override body styles for terminal page */
        body.terminal-page {
            display: block;
            align-items: unset;
            justify-content: unset;
        }
    </style>
</head>
<body class="terminal-page">
    <div class="connection-status connecting" id="status">
        Connecting...
    </div>
    <div id="terminal"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
    <script>
        // Terminal setup
        const terminal = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            lineHeight: 1.2,
            letterSpacing: 0,
            fontFamily: '"JetBrains Mono", Menlo, Monaco, "Courier New", monospace',
            theme: {
                background: '#1e1e1e',
                foreground: '#d4d4d4',
                cursor: '#ffffff',
                selection: 'rgba(255, 255, 255, 0.3)',
                black: '#1e1e1e',
                red: '#f44747',
                green: '#6a9955',
                yellow: '#dcdcaa',
                blue: '#569cd6',
                magenta: '#c586c0',
                cyan: '#4ec9b0',
                white: '#d4d4d4',
                brightBlack: '#808080',
                brightRed: '#f44747',
                brightGreen: '#6a9955',
                brightYellow: '#dcdcaa',
                brightBlue: '#569cd6',
                brightMagenta: '#c586c0',
                brightCyan: '#4ec9b0',
                brightWhite: '#ffffff'
            }
        });
        
        // Addons
        const fitAddon = new FitAddon.FitAddon();
        const webLinksAddon = new WebLinksAddon.WebLinksAddon();
        
        terminal.loadAddon(fitAddon);
        terminal.loadAddon(webLinksAddon);
        terminal.open(document.getElementById('terminal'));
        fitAddon.fit();
        
        // Connection status
        const statusEl = document.getElementById('status');
        
        function setStatus(status, text) {
            statusEl.className = 'connection-status ' + status;
            statusEl.textContent = text;
        }
        
        // Persist session ID across page refreshes so reconnects reattach
        // to the same PTY process.
        const sessionID = sessionStorage.getItem('pi_session') || (function() {
            const id = crypto.randomUUID ? crypto.randomUUID() :
                'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            sessionStorage.setItem('pi_session', id);
            return id;
        })();
        
        // WebSocket connection
        let ws;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 20;
        
        // Keep-alive: send app-level pings and detect dead connections.
        let heartbeatTimer = null;
        let pongReceived = true;
        const HEARTBEAT_INTERVAL = 25000; // 25s — under the server's 30s ping
        
        function startHeartbeat() {
            stopHeartbeat();
            pongReceived = true;
            heartbeatTimer = setInterval(function() {
                if (!pongReceived) {
                    console.warn('heartbeat: no pong, closing');
                    ws.close();
                    return;
                }
                pongReceived = false;
                sendMessage('ping', '');
            }, HEARTBEAT_INTERVAL);
        }
        
        function stopHeartbeat() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }
        
        function connect() {
            setStatus('connecting', reconnectAttempts > 0 ? 'Reconnecting...' : 'Connecting...');
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsURL = `${protocol}//${window.location.host}/ws/${sessionID}`;
            
            ws = new WebSocket(wsURL);
            
            ws.onopen = function() {
                setStatus('connected', 'Connected');
                if (reconnectAttempts > 0) {
                    terminal.write('\r\n[Reconnected]\r\n');
                }
                reconnectAttempts = 0;
                startHeartbeat();
                
                // Send terminal size so the PTY is resized to match.
                const dims = fitAddon.proposeDimensions();
                if (dims) {
                    sendMessage('resize', `${dims.cols}x${dims.rows}`);
                }
            };
            
            ws.onmessage = function(event) {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'output') {
                        terminal.write(msg.data);
                    } else if (msg.type === 'pong') {
                        pongReceived = true;
                    } else if (msg.type === 'close') {
                        terminal.write('\r\n\r\n[Session ended]\r\n');
                        sessionStorage.removeItem('pi_session');
                        stopHeartbeat();
                    }
                } catch (e) {
                    terminal.write(event.data);
                }
            };
            
            ws.onclose = function() {
                setStatus('disconnected', 'Disconnected');
                stopHeartbeat();
                
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    const delay = Math.min(2000 * reconnectAttempts, 15000);
                    terminal.write(`\r\n[Reconnecting in ${delay/1000}s...]\r\n`);
                    setTimeout(connect, delay);
                }
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }
        
        function sendMessage(type, data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type, data }));
            }
        }
        
        // Handle terminal input
        terminal.onData(function(data) {
            sendMessage('input', data);
        });
        
        // Handle resize
        window.addEventListener('resize', function() {
            fitAddon.fit();
            const dims = fitAddon.proposeDimensions();
            if (dims) {
                sendMessage('resize', `${dims.cols}x${dims.rows}`);
            }
        });
        
        // Initial resize
        setTimeout(function() {
            fitAddon.fit();
        }, 100);
        
        // Connect
        connect();
    </script>
</body>
</html>
