ignore:
  - "cmd/"
  # Test-only helpers, imported solely from _test.go files; the Windows arms
  # of these helpers can never execute on the Linux coverage job.
  - "internal/testenv/"
  # protoc output for the vendored kagent API. Generated accessors and
  # descriptor tables are not code this repo can meaningfully test, and at
  # ~2.5k lines they would otherwise dominate any diff that regenerates them.
  - "internal/kagentapi/"