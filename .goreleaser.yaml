version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/pi
    binary: pi
    env:
      - CGO_ENABLED=0
      # No GOEXPERIMENT=simd: Go 1.27 changed the simd/archsimd intrinsics API
      # and gomlx/compute's amd64 kernels (gated on goexperiment.simd) do not
      # compile against it yet. The kernels' benefit was noise anyway.
    ldflags:
      - -s -w
      - -X github.com/dimetron/pi-go/internal/cli.Version={{.Version}}
      - -X github.com/dimetron/pi-go/internal/cli.BuildTag={{.ShortCommit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

# Per-archive SBOMs, cataloged by syft from the archive's contents. The sbom
# pipe runs before the checksum pipe, so every `*.sbom.json` ends up both in
# checksums.txt and uploaded to the release next to the archive it describes.
sboms:
  - id: archives
    artifacts: archive
    # Spelled out rather than relying on GoReleaser's defaults, which pass
    # `--enrich all`: that makes network calls to third-party metadata sources
    # and would let an outage upstream fail a release.
    args:
      - scan
      - "$artifact"
      - --output
      - "spdx-json=$document"
    documents:
      - "${artifact}.sbom.json"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: dimetron
    name: pi-go
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  # Aggregate source SBOM built by the release workflow before GoReleaser runs.
  # It is the SBOM bound to every artifact by the attestation step, so publish
  # it alongside the per-archive ones. extra_files are added by the release
  # pipe, which runs after checksums, so this file is not listed in
  # checksums.txt and therefore is not a subject of its own attestation.
  extra_files:
    - glob: ./sbom.spdx.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_sbom.spdx.json"
